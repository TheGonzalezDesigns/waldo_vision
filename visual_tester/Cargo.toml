[package]
name = "visual_tester"
version = "0.1.0"
edition = "2024"

[dependencies]
waldo_vision = { path = "../waldo_vision" }
opencv = { version = "0.88.8", default-features = false, features = ["videoio", "highgui", "imgproc"] }
tokio = { version = "1", features = ["full"] }
image = "0.25.6"
waldo_vision_visualizer = { path = "../waldo_vision_visualizer", optional = true }

[features]
default = []
# Enable web server integration via the visualizer crate
web = ["waldo_vision_visualizer/web"]
# Forward the waldo_vision `accurate` feature so callers can enable it
accurate = ["waldo_vision/accurate"]
